<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Register</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

  <style>
    /* Animated Background */

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(-45deg, #6a11cb, #2575fc, #00c6ff, #7f00ff);
      background-size: 400% 400%;
      animation: gradientBG 10s ease infinite;
      font-family: 'Segoe UI', sans-serif;
    }

    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    /* Glass Card */

    .glass-card {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 20px;
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.2);
      padding: 40px;
      color: white;
    }

    /* Inputs */

    .form-control {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
      border-radius: 10px;
    }

    .form-control::placeholder {
      color: #eee;
    }

    .input-group-text {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: white;
    }

    /* Button */

    .btn-register {
      background: white;
      color: #333;
      border-radius: 10px;
      font-weight: 600;
      transition: 0.3s;
    }

    .btn-register:hover {
      transform: translateY(-2px);
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
    }

    /* Responsive */

    @media(max-width:576px) {
      .glass-card {
        padding: 30px 20px;
      }
    }
  </style>

</head>

<body>

  <div class="container">
    <div class="row justify-content-center">
      <div class="col-lg-4 col-md-6">

        <div class="glass-card">

          <div class="text-center mb-4">
            <i class="bi bi-person-plus-fill" style="font-size:50px;"></i>
            <h3 class="mt-2">Create Account</h3>
            <p class="text-light">Register to get started</p>
          </div>

          <form>

            <div class="mb-3">
              <label>Full Name</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-person"></i></span>
                <input type="text" class="form-control" placeholder="Enter your name">
              </div>
            </div>

            <div class="mb-3">
              <label>Email</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                <input type="email" class="form-control" placeholder="Enter email">
              </div>
            </div>

            <div class="mb-3">
              <label>Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-lock"></i></span>
                <input type="password" class="form-control" placeholder="Create password">
              </div>
            </div>

            <div class="mb-3">
              <label>Confirm Password</label>
              <div class="input-group">
                <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
                <input type="password" class="form-control" placeholder="Confirm password">
              </div>
            </div>

            <div class="d-grid mb-3">
              <button class="btn btn-register">Register</button>
            </div>

            <div class="text-center">
              <span>Already have an account?</span>
              <a href="login.html" class="text-white fw-bold">Login</a>
            </div>

          </form>

        </div>

      </div>
    </div>
  </div>

</body>

</html>
